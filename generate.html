<!-- Open this file in a browser to preview the WeDID icon source at extension sizes. -->
<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      display: flex;
      align-items: flex-start;
      gap: 32px;
      padding: 32px;
      background: #e2e8f0;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .preview {
      text-align: center;
    }
    .frame {
      display: grid;
      place-items: center;
      width: 160px;
      height: 160px;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      background:
        linear-gradient(45deg, #f8fafc 25%, transparent 25%) -12px 0 / 24px 24px,
        linear-gradient(-45deg, #f8fafc 25%, transparent 25%) -12px 0 / 24px 24px,
        linear-gradient(45deg, transparent 75%, #f8fafc 75%) -12px 0 / 24px 24px,
        linear-gradient(-45deg, transparent 75%, #f8fafc 75%) -12px 0 / 24px 24px,
        #e2e8f0;
    }
    .preview img {
      display: block;
      image-rendering: auto;
    }
    .preview p {
      margin-top: 12px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="preview">
    <div class="frame"><img src="icon.svg" width="128" height="128" alt="WeDID icon preview at 128 pixels"></div>
    <p>128x128</p>
  </div>
  <div class="preview">
    <div class="frame"><img src="icon.svg" width="48" height="48" alt="WeDID icon preview at 48 pixels"></div>
    <p>48x48</p>
  </div>
  <div class="preview">
    <div class="frame"><img src="icon.svg" width="16" height="16" alt="WeDID icon preview at 16 pixels"></div>
    <p>16x16</p>
  </div>
</body>
</html>
