<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      max-width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
    }

    @media (max-width: 400px) {
      body {
        width: 100%;
      }
    }

    nav {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav h1 {
      font-size: 15px;
      font-weight: 600;
    }

    nav .version {
      font-size: 11px;
      color: #888;
    }

    .site {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5e5;
    }

    .site-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 4px;
    }

    .site-host {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      color: #0f172a;
      word-break: break-all;
    }

    #status {
      padding: 12px 16px;
    }

    .status-empty {
      color: #888;
      text-align: center;
      padding: 20px 0;
    }

    .did-result {
      padding: 8px 0;
    }

    .did-id {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      word-break: break-all;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin: 8px 0 4px;
    }

    .service-item {
      padding: 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .service-type {
      font-size: 12px;
      font-weight: 500;
    }

    .service-endpoint {
      font-size: 11px;
      color: #059669;
      text-decoration: none;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .service-endpoint:hover {
      text-decoration: underline;
    }

    .verification-methods {
      list-style: none;
    }

    .verification-methods li {
      font-size: 12px;
      padding: 2px 0;
      font-family: "SF Mono", "Fira Code", monospace;
      color: #555;
    }

    .error {
      color: #dc2626;
      font-size: 12px;
      padding: 8px 0;
    }

    .status-subtle {
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 6px;
    }

    .meta {
      font-size: 11px;
      color: #aaa;
      padding: 8px 16px;
      border-top: 1px solid #e5e5e5;
      text-align: center;
    }

    .meta a {
      color: #888;
      text-decoration: none;
    }

    .meta a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav>
    <h1>WeDID</h1>
    <span class="version">v0.1.0</span>
  </nav>

  <div class="site">
    <div class="site-label">Current Site</div>
    <div id="site-host" class="site-host">Checking active tab...</div>
  </div>

  <div id="status">
    <div class="status-empty">
      Resolving site DID...
    </div>
  </div>

  <div class="meta">
    <a
      href="https://wedid.app"
      target="_blank"
    >wedid.app</a>
    &middot;
    W3C DID Resolver
  </div>

  <script src="popup.js"></script>
</body>
</html>
